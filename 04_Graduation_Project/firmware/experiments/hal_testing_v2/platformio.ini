; Stand-alone test bench for the 7-segment display on two PCF8574 chips (0x21 tens , 0x22 units)
; Same settings as project_v1 (bare-metal avr-gcc , F_CPU from board_build.f_cpu) and a copy of its lib/ folder
;   pio run              -> .pio/build/seven_seg_i2c_test/firmware.hex

[env]
platform = atmelavr
board = ATmega32
board_build.f_cpu = 16000000L
build_flags =
    -I lib/MCAL
    -I lib/HAL
    -I lib/Service
    -Wall

[env:seven_seg_i2c_test]
lib_deps =
    MCAL
    HAL
