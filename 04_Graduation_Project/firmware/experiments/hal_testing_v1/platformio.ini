; Stand-alone test bench for the 2-digit multiplexed 7-segment display (7447 BCD decoder)
; Same layout and settings as project_v1 (bare-metal avr-gcc , F_CPU from board_build.f_cpu)
;   pio run              -> .pio/build/seven_seg_test/firmware.hex

[env]
platform = atmelavr
board = ATmega32
board_build.f_cpu = 16000000L
build_flags =
    -I lib/MCAL
    -I lib/HAL
    -I lib/Service
    -Wall

[env:seven_seg_test]
lib_deps =
    MCAL
    HAL
