   <g id="text_25">
    <text style="font-size: 6.8px; font-family: 'Inter'" transform="translate(209.809346 62.862297)">scan (KPAD_voidUpdate, every 10 ms):</text>
    <text style="font-size: 6.8px; font-family: 'Inter'" transform="translate(209.809346 71.090031)">for each column: drive LOW, wait 5 µs,</text>
    <text style="font-size: 6.8px; font-family: 'Inter'" transform="translate(209.809346 79.317766)">read the 4 rows; a LOW row = key at</text>
    <text style="font-size: 6.8px; font-family: 'Inter'" transform="translate(209.809346 87.5455)">(row, column); drive the column HIGH.</text>
    <text style="font-size: 6.8px; font-family: 'Inter'" transform="translate(209.809346 95.773234)">Accepted after 2 equal scans (20 ms);</text>
    <text style="font-size: 6.8px; font-family: 'Inter'" transform="translate(209.809346 104.000969)">reported once (KPAD_u8GetKey).</text>
   </g>
