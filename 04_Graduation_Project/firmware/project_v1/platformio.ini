; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common settings shared by every environment below
[env]
platform = atmelavr
board = ATmega32
board_build.f_cpu = 16000000L
build_flags =
    -I lib/MCAL
    -I lib/HAL
    -I lib/Service
    -I src/APP

; Real application: src/APP/main.c   ->  pio run -e app
[env:app]

; Phase 0 smoke test of the existing drivers   ->  pio run -e test_base
; Excludes the application main.c and builds test_mains/test_base.c instead.
; Driver sources in lib/ are compiled as libraries (all modules forced by lib_deps).
[env:test_base]
build_src_filter = -<*> +<../test_mains/test_base.c>
build_flags =
    ${env.build_flags}
    -Wall
lib_deps =
    MCAL
    HAL

; Phase 2 MCAL test   ->  pio run -e test_mcal
[env:test_mcal]
build_src_filter = -<*> +<../test_mains/test_mcal.c>
build_flags =
    ${env.build_flags}
    -Wall
lib_deps =
    MCAL
